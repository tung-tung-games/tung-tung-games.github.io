<body>

    <!-- MAIN WEBSITE -->

    <script>

        /*

        /* TOTAL NUMBER OF GAMES */

        const GAME_COUNT = 100;


        /* NUMBER OF GAMES SHOWN ON HOME PAGE */

        const HOME_GAME_COUNT = 8;


        /*
         * GAME NAMES

         *

         * 2: "Fortnite",

         *

         */

        const GAME_NAMES = {

            1: "Game 1",

        };


        /* GET GAME NAME */

        function getGameName(number) {

            return GAME_NAMES[number] || "Game " + number;

        }


        /* CREATE A GAME CARD */

        function gameCard(number) {

            const name = getGameName(number);

            return `
                <div class="game">

                    <img
                        src="${number}.png"
                        alt="${name}"
                    >

                    <h3>${name}</h3>

                    <p>${name}</p>

                    <a
                        class="play"
                        href="${number}.html"
                        onclick="recordVisit(${number})"
                    >
                        Play
                    </a>

                </div>
            `;

        }


        /* GET TODAY'S DATE */

        function getTodayKey() {

            const now = new Date();

            return now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");

        }


        /* GET POPULARITY DATA */

        function getPopularity() {

            const today = getTodayKey();

            const saved = JSON.parse(
                localStorage.getItem("tungGamePopularity") || "{}"
            );


            /*
             * If the date has changed,
             * start a completely new popularity list.
             */

            if (saved.date !== today) {

                const freshData = {
                    date: today,
                    visits: {}
                };

                localStorage.setItem(
                    "tungGamePopularity",
                    JSON.stringify(freshData)
                );

                return freshData;

            }


            return saved;

        }


        /* RECORD A GAME VISIT */

        function recordVisit(number) {

            const popularity = getPopularity();

            popularity.visits[number] =
                (popularity.visits[number] || 0) + 1;


            localStorage.setItem(
                "tungGamePopularity",
                JSON.stringify(popularity)
            );

        }


        /* SORT GAMES BY POPULARITY */

        function getPopularGames() {

            const popularity = getPopularity();


            const games = Array.from(
                { length: GAME_COUNT },
                (_, index) => index + 1
            );


            games.sort((a, b) => {

                const visitsA =
                    popularity.visits[a] || 0;

                const visitsB =
                    popularity.visits[b] || 0;


                /* Most visits first */

                if (visitsB !== visitsA) {

                    return visitsB - visitsA;

                }


                /* If tied, lower game number first */

                return a - b;

            });


            return games;

        }


        /* SHOW ONLY THE TOP 8 ON HOME */

        function renderHomeGames() {

            const list =
                document.getElementById("gameList");


            const popularGames =
                getPopularGames().slice(0, HOME_GAME_COUNT);


            list.innerHTML =
                popularGames
                    .map(number => gameCard(number))
                    .join("");

        }


        /* SHOW ALL 100 GAMES */

        function renderAllGames() {

            const list =
                document.getElementById("allGameList");


            list.innerHTML =
                Array.from(
                    { length: GAME_COUNT },
                    (_, index) => gameCard(index + 1)
                ).join("");

        }


        /* HOME BUTTON */

        function showHome(event) {

            if (event) {
                event.preventDefault();
            }


            document.getElementById("website")
                .style.display = "block";

            document.getElementById("gamesPage")
                .style.display = "none";

            document.getElementById("cloudGaming")
                .style.display = "none";


            renderHomeGames();


            window.scrollTo(0, 0);

        }


        /* GAMES BUTTON */

        function showGames(event) {

            if (event) {
                event.preventDefault();
            }


            document.getElementById("website")
                .style.display = "none";

            document.getElementById("gamesPage")
                .style.display = "block";

            document.getElementById("cloudGaming")
                .style.display = "none";


            renderAllGames();


            window.scrollTo(0, 0);

        }


        /* PASSWORD */

        function checkPassword() {

            const password =
                document.getElementById("passwordInput").value;


            const error =
                document.getElementById("error");


            if (password === "TUNG") {

                document.getElementById("passwordScreen")
                    .style.display = "none";


                document.getElementById("website")
                    .style.display = "block";


                document.getElementById("gamesPage")
                    .style.display = "none";


                document.getElementById("cloudGaming")
                    .style.display = "none";


                error.style.display = "none";


                renderHomeGames();

            }

            else {

                error.style.display = "block";

            }

        }


        /* CLOUD GAMING */

        function openCloudGaming(event) {

            event.preventDefault();


            document.getElementById("website")
                .style.display = "none";


            document.getElementById("gamesPage")
                .style.display = "none";


            document.getElementById("cloudGaming")
                .style.display = "block";


            window.scrollTo(0, 0);

        }


        /* BACK FROM CLOUD GAMING */

        function goBack() {

            document.getElementById("cloudGaming")
                .style.display = "none";


            document.getElementById("gamesPage")
                .style.display = "none";


            document.getElementById("website")
                .style.display = "block";


            renderHomeGames();


            window.scrollTo(0, 0);

        }


        /* ENTER KEY FOR PASSWORD */

        document
            .getElementById("passwordInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        checkPassword();

                    }

                }
            );

    </script>

</body>
</html>

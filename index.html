<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPIRE</title>

    <link rel="icon" type="image/png" href="SPIRE.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #121212;
            color: white;
        }

        /* PASSWORD SCREEN */

        #passwordScreen {
            position: fixed;
            inset: 0;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .passwordBox {
            background: #1d1d1d;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 2px solid #C8A27A;
        }

        .passwordBox img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .passwordBox h2 {
            margin-bottom: 10px;
        }

        .passwordBox p {
            color: #bbbbbb;
            margin-bottom: 20px;
        }

        .passwordBox input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
        }

        .passwordBox button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #C8A27A;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .passwordBox button:hover {
            background: #A9825D;
        }

        #error {
            color: #ff5555;
            margin-top: 15px;
            display: none;
        }

        /* MAIN WEBSITE */

        #website {
            display: none;
        }

        header {
            background: #1f1f1f;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.25s;
        }

        nav a:hover {
            color: #C8A27A;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 42px;
        }

        /* GAMES */

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .game {
            background: #1d1d1d;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.25s;
        }

        .game:hover {
            transform: translateY(-8px);
            border-color: #C8A27A;
        }

        .game img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .game h3 {
            margin-bottom: 12px;
        }

        .game p {
            color: #bbbbbb;
            margin-bottom: 20px;
        }

        .play {
            display: inline-block;
            padding: 12px 22px;
            background: #C8A27A;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.25s;
        }

        .play:hover {
            background: #A9825D;
        }

        /* COPYRIGHT */

        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .secretLink {
            color: #888;
            text-decoration: none;
            cursor: pointer;
            transition: 0.25s;
        }

        .secretLink:hover {
            color: #C8A27A;
        }

        /* ALL GAMES PAGE */

        #gamesPage {
            display: none;
            min-height: 100vh;
        }

        /* SECRET CLOUD GAMING PAGE */

        #cloudGaming {
            display: none;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }

        .cloudHeader {
            margin-bottom: 50px;
        }

        .cloudHeader img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .cloudHeader h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .cloudHeader p {
            color: #bbbbbb;
            font-size: 18px;
        }

        .cloudContent {
            max-width: 900px;
            margin: auto;
            background: #1d1d1d;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #C8A27A;
        }

        .cloudContent h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .cloudContent p {
            color: #bbbbbb;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cloudButton {
            padding: 14px 25px;
            background: #C8A27A;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.25s;
        }

        .cloudButton:hover {
            background: #A9825D;
        }

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 14px;
            }

            .logo h1 {
                font-size: 22px;
            }

            .cloudHeader h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- PASSWORD SCREEN -->

    <div id="passwordScreen">

        <div class="passwordBox">

            <img src="tung-nobg.png" alt="Tung">

            <h2>Enter Password</h2>

            <p>Enter the password to access Tung Games.</p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off"
            >

            <button onclick="checkPassword()">Enter</button>

            <p id="error">Incorrect password!</p>

        </div>

    </div>


    <!-- MAIN WEBSITE -->

    <div id="website">

        <header>

            <div class="logo">
                <img src="tung-nobg.png" alt="Tung">
                <h1>Tung Games</h1>
            </div>

            <nav>
                <a href="#" onclick="showHome(event)">Home</a>
                <a href="#" onclick="showGames(event)">Games</a>
            </nav>

        </header>


        <section class="hero">
            <h2>Tung Games</h2>
        </section>


        <!-- TOP 5 MOST POPULAR GAMES -->

        <section class="games" id="gameList">
            <!-- Automatically filled with the 5 most popular games -->
        </section>


        <footer>
            <a href="#" class="secretLink" onclick="openCloudGaming(event)">
                © 2026 Tung Games
            </a>
        </footer>

    </div>


    <!-- ALL GAMES PAGE -->

    <div id="gamesPage">

        <section class="hero">
            <h2>All Games</h2>
        </section>

        <section class="games" id="allGameList">
            <!-- All 50 games appear here -->
        </section>

    </div>


    <!-- CLOUD GAMING PAGE -->

    <div id="cloudGaming">

        <div class="cloudHeader">

            <img src="tung-nobg.png" alt="tung">

            <h1>Tung Cloud Gaming</h1>

        </div>

        <div class="cloudContent">

            <h2>Cloud Gaming</h2>

            <p>
                Welcome to Tung Cloud Gaming.
            </p>

            <button class="cloudButton" onclick="goBack()">
                Back
            </button>

        </div>

    </div>


    <script>

        /*
         * GAME FILE SETUP
         *
         * Game 1:
         * 1.html
         * 1.png
         *
         * Game 2:
         * 2.html
         * 2.png
         *
         * ...
         *
         * Game 50:
         * 50.html
         * 50.png
         *
         * All files should be in the SAME folder
         * as this main HTML file.
         */


        const GAME_COUNT = 50;


        /* CREATE A GAME CARD */

        function gameCard(number) {

            return `
                <div class="game">

                    <img src="${number}.png" alt="Game ${number}">

                    <h3>Game ${number}</h3>

                    <p>Game ${number}</p>

                    <a
                        class="play"
                        href="${number}.html"
                        onclick="recordVisit(${number})"
                    >
                        Play
                    </a>

                </div>
            `;

        }


        /* GET TODAY'S DATE */

        function getTodayKey() {

            const now = new Date();

            return now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");

        }


        /* GET POPULARITY DATA */

        function getPopularity() {

            const today = getTodayKey();

            const saved = JSON.parse(
                localStorage.getItem("tungGamePopularity") || "{}"
            );


            /*
             * If the date has changed,
             * start a completely new popularity list.
             */

            if (saved.date !== today) {

                return {
                    date: today,
                    visits: {}
                };

            }


            return saved;

        }


        /* RECORD A GAME VISIT */

        function recordVisit(number) {

            const popularity = getPopularity();

            popularity.visits[number] =
                (popularity.visits[number] || 0) + 1;


            localStorage.setItem(
                "tungGamePopularity",
                JSON.stringify(popularity)
            );

        }


        /* SORT GAMES BY POPULARITY */

        function getPopularGames() {

            const popularity = getPopularity();


            const games = Array.from(
                { length: GAME_COUNT },
                (_, index) => index + 1
            );


            games.sort((a, b) => {

                const visitsA =
                    popularity.visits[a] || 0;

                const visitsB =
                    popularity.visits[b] || 0;


                /* Most visits first */

                if (visitsB !== visitsA) {

                    return visitsB - visitsA;

                }


                /* If tied, lower game number first */

                return a - b;

            });


            return games;

        }


        /* SHOW ONLY THE TOP 5 ON HOME */

        function renderHomeGames() {

            const list =
                document.getElementById("gameList");


            const popularGames =
                getPopularGames().slice(0, 5);


            list.innerHTML =
                popularGames
                    .map(number => gameCard(number))
                    .join("");

        }


        /* SHOW ALL 50 GAMES */

        function renderAllGames() {

            const list =
                document.getElementById("allGameList");


            list.innerHTML =
                Array.from(
                    { length: GAME_COUNT },
                    (_, index) => gameCard(index + 1)
                ).join("");

        }


        /* HOME BUTTON */

        function showHome(event) {

            if (event) {
                event.preventDefault();
            }


            document.getElementById("website")
                .style.display = "block";

            document.getElementById("gamesPage")
                .style.display = "none";

            document.getElementById("cloudGaming")
                .style.display = "none";


            renderHomeGames();


            window.scrollTo(0, 0);

        }


        /* GAMES BUTTON */

        function showGames(event) {

            if (event) {
                event.preventDefault();
            }


            document.getElementById("website")
                .style.display = "none";

            document.getElementById("gamesPage")
                .style.display = "block";

            document.getElementById("cloudGaming")
                .style.display = "none";


            renderAllGames();


            window.scrollTo(0, 0);

        }


        /* PASSWORD */

        function checkPassword() {

            const password =
                document.getElementById("passwordInput").value;


            const error =
                document.getElementById("error");


            if (password === "TUNG") {

                document.getElementById("passwordScreen")
                    .style.display = "none";


                document.getElementById("website")
                    .style.display = "block";


                document.getElementById("gamesPage")
                    .style.display = "none";


                document.getElementById("cloudGaming")
                    .style.display = "none";


                error.style.display = "none";


                renderHomeGames();

            }

            else {

                error.style.display = "block";

            }

        }


        /* CLOUD GAMING */

        function openCloudGaming(event) {

            event.preventDefault();


            document.getElementById("website")
                .style.display = "none";


            document.getElementById("gamesPage")
                .style.display = "none";


            document.getElementById("cloudGaming")
                .style.display = "block";


            window.scrollTo(0, 0);

        }


        /* BACK FROM CLOUD GAMING */

        function goBack() {

            document.getElementById("cloudGaming")
                .style.display = "none";


            document.getElementById("gamesPage")
                .style.display = "none";


            document.getElementById("website")
                .style.display = "block";


            renderHomeGames();


            window.scrollTo(0, 0);

        }


        /* ENTER KEY FOR PASSWORD */

        document
            .getElementById("passwordInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        checkPassword();

                    }

                }
            );

    </script>

</body>
</html>

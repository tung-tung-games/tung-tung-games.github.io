    function getGameName(number) {
        return GAME_NAMES[number] || "Game " + number;
    }

    function gameCard(number) {

        const name = getGameName(number);

        return `
            <div class="game">

                <img
                    src="${number}.png"
                    alt="${name}"
                >

                <h3>${name}</h3>

                <p>${name}</p>

                <a
                    class="play"
                    href="${number}.html"
                    onclick="recordVisit(${number})"
                >
                    Play
                </a>

            </div>
        `;

    }

    function getTodayKey() {

        const now = new Date();

        return now.getFullYear() + "-" +
            String(now.getMonth() + 1).padStart(2, "0") + "-" +
            String(now.getDate()).padStart(2, "0");

    }

    function getPopularity() {

        const today = getTodayKey();

        const saved = JSON.parse(
            localStorage.getItem("tungGamePopularity") || "{}"
        );

        if (saved.date !== today) {

            const freshData = {
                date: today,
                visits: {}
            };

            localStorage.setItem(
                "tungGamePopularity",
                JSON.stringify(freshData)
            );

            return freshData;
        }

        return saved;

    }

    function recordVisit(number) {

        const popularity = getPopularity();

        popularity.visits[number] =
            (popularity.visits[number] || 0) + 1;

        localStorage.setItem(
            "tungGamePopularity",
            JSON.stringify(popularity)
        );

    }

    function getPopularGames() {

        const popularity = getPopularity();

        const games = Array.from(
            { length: GAME_COUNT },
            (_, index) => index + 1
        );

        games.sort((a, b) => {

            const visitsA =
                popularity.visits[a] || 0;

            const visitsB =
                popularity.visits[b] || 0;

            if (visitsB !== visitsA) {
                return visitsB - visitsA;
            }

            return a - b;

        });

        return games;

    }

    function renderHomeGames() {

        const list =
            document.getElementById("gameList");

        const popularGames =
            getPopularGames().slice(0, HOME_GAME_COUNT);

        list.innerHTML =
            popularGames
                .map(number => gameCard(number))
                .join("");

        addTiltEffects();

    }

    function renderAllGames() {

        const list =
            document.getElementById("allGameList");

        list.innerHTML =
            Array.from(
                { length: GAME_COUNT },
                (_, index) => gameCard(index + 1)
            ).join("");

        addTiltEffects();

    }

    function addTiltEffects() {

        const cards =
            document.querySelectorAll(".game");

        cards.forEach(card => {

            card.addEventListener("mousemove", event => {

                const rect =
                    card.getBoundingClientRect();

                const x =
                    event.clientX - rect.left;

                const y =
                    event.clientY - rect.top;

                const centerX =
                    rect.width / 2;

                const centerY =
                    rect.height / 2;

                const rotateY =
                    ((x - centerX) / centerX) * 8;

                const rotateX =
                    ((centerY - y) / centerY) * 8;

                card.style.transform =
                    `perspective(900px)
                     rotateX(${rotateX}deg)
                     rotateY(${rotateY}deg)
                     translateY(-6px)
                     scale(1.015)`;

            });

            card.addEventListener("mouseleave", () => {

                card.style.transform =
                    "perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)";

            });

        });

    }

    function showHome(event) {

        if (event) {
            event.preventDefault();
        }

        document.getElementById("website")
            .style.display = "block";

        document.getElementById("gamesPage")
            .style.display = "none";

        document.getElementById("cloudGaming")
            .style.display = "none";

        renderHomeGames();

        window.scrollTo(0, 0);

    }

    function showGames(event) {

        if (event) {

        document.getElementById("gamesPage")
            .style.display = "block";

        document.getElementById("cloudGaming")
            .style.display = "none";

        renderAllGames();

        window.scrollTo(0, 0);

    }

    function checkPassword() {

        const password =
            document.getElementById("passwordInput").value;

        const error =
            document.getElementById("error");

        if (password === "TUNG") {

            document.getElementById("passwordScreen")
                .style.display = "none";

            document.getElementById("website")
                .style.display = "block";

            document.getElementById("gamesPage")
                .style.display = "none";

            document.getElementById("cloudGaming")
                .style.display = "none";

            error.style.display = "none";

            renderHomeGames();

        } else {

            error.style.display = "block";

            error.style.animation = "none";

            void error.offsetWidth;

            error.style.animation = "shake 0.35s ease";

        }

    }

    function openCloudGaming(event) {

        event.preventDefault();

        document.getElementById("website")
            .style.display = "none";

        document.getElementById("gamesPage")
            .style.display = "none";

        document.getElementById("cloudGaming")
            .style.display = "block";

        window.scrollTo(0, 0);

    }

    function goBack() {

        document.getElementById("cloudGaming")
            .style.display = "none";

        document.getElementById("gamesPage")
            .style.display = "none";

        document.getElementById("website")
            .style.display = "block";

        renderHomeGames();

        window.scrollTo(0, 0);

    }

    document
        .getElementById("passwordInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            }
        );

</script>

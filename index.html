<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="SPIRE.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --bg: #121212;
    --card: #1d1d1d;
    --accent: #C8A27A;
    --accent-dark: #A9825D;
    --text: #fff;
    --secondary: #bbb;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* PASSWORD */

#passwordScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 9999;
}

.passwordBox {
    width: 90%;
    max-width: 400px;
    padding: 42px;
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(200,162,122,.45);
    border-radius: 20px;
    box-shadow: 0 25px 70px rgba(0,0,0,.55);
    animation: passwordIn .7s ease;
}

.passwordBox img {
    width: 105px;
    height: 105px;
    object-fit: contain;
    display: block;
    margin: 0 auto 20px;
    animation: float 4s ease-in-out infinite;
}

.passwordBox h2 {
    font-size: 27px;
    margin-bottom: 10px;
}

.passwordBox p {
    color: var(--secondary);
    margin-bottom: 20px;
}

.passwordBox input {
    width: 100%;
    padding: 14px;
    border: 2px solid transparent;
    border-radius: 9px;
    outline: none;
    background: white;
    color: #111;
    font-size: 16px;
    text-align: center;
    margin-bottom: 14px;
    transition: .25s ease;
}

.passwordBox input:focus {
    border-color: var(--accent);
}

.passwordBox button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s ease;
}

.passwordBox button:hover {
    background: var(--accent-dark);
}

#passwordError {
    display: none;
    color: #ff6666;
    margin-top: 14px;
    margin-bottom: 0;
}

/* WEBSITE */

#website {
    display: none;
}

header {
    height: 70px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(31,31,31,.96);
    border-bottom: 1px solid rgba(255,255,255,.025);
    box-shadow: 0 5px 20px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 50%;
    transition: .3s ease;
}

.logo:hover img {
    transform: rotate(8deg) scale(1.08);
}

.logo h1 {
    font-size: 28px;
}

/* TOP BAR */

nav {
    display: flex;
    gap: 10px;
}

.navButton {

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPIRE</title>

<link rel="icon" type="image/png" href="SPIRE.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --bg: #121212;
    --card: #1d1d1d;
    --accent: #C8A27A;
    --accent-dark: #A9825D;
    --text: #ffffff;
    --secondary: #bbbbbb;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* PASSWORD SCREEN */

#passwordScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 9999;
    animation: fadeIn .6s ease;
}

.passwordBox {
    width: 90%;
    max-width: 400px;
    padding: 42px;
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(200,162,122,.45);
    border-radius: 20px;
    box-shadow: 0 25px 70px rgba(0,0,0,.55);
    animation: passwordIn .7s ease;
}

.passwordBox img {
    width: 105px;
    height: 105px;
    object-fit: contain;
    display: block;
    margin: 0 auto 20px;
    animation: float 4s ease-in-out infinite;
}

.passwordBox h2 {
    font-size: 27px;
    margin-bottom: 10px;
}

.passwordBox p {
    color: var(--secondary);
    margin-bottom: 20px;
}

.passwordBox input {
    width: 100%;
    padding: 14px;
    border: 2px solid transparent;
    border-radius: 9px;
    outline: none;
    background: white;
    color: #111;
    font-size: 16px;
    text-align: center;
    margin-bottom: 14px;
    transition: .25s ease;
}

.passwordBox input:focus {
    border-color: var(--accent);
}

.passwordBox button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s ease;
}

.passwordBox button:hover {
    background: var(--accent-dark);
}

#passwordError {
    display: none;
    color: #ff6666;
    margin-top: 14px;
    margin-bottom: 0;
}

/* MAIN WEBSITE */

#website {
    display: none;
    animation: pageIn .5s ease;
}

header {
    height: 70px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(31,31,31,.96);
    border-bottom: 1px solid rgba(255,255,255,.025);
    box-shadow: 0 5px 20px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 50%;
    transition: .3s ease;
}

.logo:hover img {
    transform: rotate(8deg) scale(1.08);
}

.logo h1 {
    font-size: 28px;
}

/* TOP BAR BUTTONS */

nav {
    display: flex;
    align-items: center;
    gap: 10px;
}

.navButton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 82px;
    padding: 10px 18px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.045);
    cursor: pointer;
    will-change: transform;
    transition:
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.navButton:hover {
    background: rgba(200,162,122,.12);
    border-color: rgba(200,162,122,.35);
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

/* HERO */

.hero {
    text-align: center;
    padding: 65px 20px 35px;
}

.hero h2 {
    font-size: 46px;
    letter-spacing: -1px;
    animation: heroIn .7s ease;
}

/* GAME GRID */

.games {
    max-width: 1250px;
    margin: auto;
    padding: 35px 40px 50px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    perspective: 1200px;
}

/* WHOLE GAME TILE */

.game {
    position: relative;
    padding: 22px;
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.035);
    border-radius: 17px;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
    will-change: transform;
    transform: translate3d(0,0,0) rotate(0deg) scale(1);
    transition:
        border-color .25s ease,
        box-shadow .25s ease;
    animation: cardIn .55s ease both;
}

.game:hover {
    border-color: rgba(200,162,122,.45);
    box-shadow:
        0 22px 45px rgba(0,0,0,.35),
        0 0 28px rgba(200,162,122,.07);
}

.game img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 11px;
    margin-bottom: 16px;
    transition: transform .25s ease;
}

.game:hover img {
    transform: scale(1.03);
}

.game h3 {
    margin-bottom: 10px;
    font-size: 20px;
}

.game p {
    color: var(--secondary);
    margin-bottom: 20px;
    font-size: 14px;
}

/* PLAY BUTTON */

.play {
    display: inline-block;
    padding: 12px 23px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: .25s ease;
}

.play:hover {
    background: var(--accent-dark);
    box-shadow: 0 8px 22px rgba(200,162,122,.18);
}

/* FOOTER */

footer {
    text-align: center;
    padding: 45px 30px 35px;
}

.secretLink {
    color: #777777;
    text-decoration: none;
    transition: .3s ease;
}

.secretLink:hover {
    color: var(--accent);
}

/* ALL GAMES */

#gamesPage {
    display: none;
    min-height: 100vh;
    animation: pageIn .5s ease;
}

/* CLOUD GAMING */

#cloudGaming {
    display: none;
    min-height: 100vh;
    text-align: center;
    padding: 55px 20px;
    animation: pageIn .5s ease;
}

.cloudHeader img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 20px;
    animation: float 4s ease-in-out infinite;
}

.cloudHeader h1 {
    font-size: 48px;
    margin-bottom: 45px;
}

.cloudContent {
    max-width: 900px;
    margin: auto;
    padding: 45px;
    background: var(--card);
    border: 1px solid rgba(200,162,122,.4);
    border-radius: 18px;
    box-shadow: 0 20px 55px rgba(0,0,0,.3);
}

.cloudContent h2 {
    font-size: 32px;
    margin-bottom: 20px;
}

.cloudContent p {
    color: var(--secondary);
    margin-bottom: 30px;
}

.cloudButton {
    padding: 14px 27px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .25s ease;
}

.cloudButton:hover {
    background: var(--accent-dark);
}

/* ANIMATIONS */

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes passwordIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heroIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    75% {
        transform: translateX(5px);
    }
}

/* MOBILE */

@media(max-width:700px) {

    header {
        padding: 0 20px;
    }

    nav {
        gap: 6px;
    }

    .navButton {
        min-width: 65px;
        padding: 9px 12px;
        font-size: 14px;
    }

    .logo h1 {
        font-size: 22px;
    }

    .hero h2 {
        font-size: 36px;
    }

    .games {
        grid-template-columns: 1fr;
        padding: 25px 20px;
    }

    .cloudHeader h1 {
        font-size: 36px;
    }

    .cloudContent {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<!-- PASSWORD -->

<div id="passwordScreen">

    <div class="passwordBox">

        <img src="tung-nobg.png" alt="Tung">

        <h2>Enter Password</h2>

        <p>Enter the password to access Tung Games.</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
            autocomplete="off"
        >

        <button onclick="checkPassword()">Enter</button>

        <p id="passwordError">Incorrect password!</p>

    </div>

</div>

<!-- MAIN WEBSITE -->

<div id="website">

    <header>

        <div class="logo">
            <img src="tung-nobg.png" alt="Tung">
            <h1>Tung Games</h1>
        </div>

        <nav>

            <a
                href="#"
                class="navButton"
                onclick="showHome(event)"
            >
                Home
            </a>

            <a
                href="#"
                class="navButton"
                onclick="showGames(event)"
            >
                Games
            </a>

        </nav>

    </header>

    <section class="hero">
        <h2>Tung Games</h2>
    </section>

    <section
        class="games"
        id="gameList"
    ></section>

    <footer>

        <a
            href="#"
            class="secretLink"
            onclick="openCloudGaming(event)"
        >
            © 2026 Tung Games
        </a>

    </footer>

</div>

<!-- ALL GAMES PAGE -->

<div id="gamesPage">

    <section class="hero">
        <h2>All Games</h2>
    </section>

    <section
        class="games"
        id="allGameList"
    ></section>

</div>

<!-- CLOUD GAMING -->

<div id="cloudGaming">

    <div class="cloudHeader">

        <img
            src="tung-nobg.png"
            alt="Tung"
        >

        <h1>Tung Cloud Gaming</h1>

    </div>

    <div class="cloudContent">

        <h2>Cloud Gaming</h2>

        <p>Welcome to Tung Cloud Gaming.</p>

        <button
            class="cloudButton"
            onclick="goBack()"
        >
            Back
        </button>

    </div>

</div>

<script>

const GAME_COUNT = 100;
const HOME_GAME_COUNT = 8;

const GAME_NAMES = {};

for (let i = 1; i <= GAME_COUNT; i++) {
    GAME_NAMES[i] = "Game " + i;
}

function getGameName(number) {
    return GAME_NAMES[number];
}

/* CREATE GAME TILE */

function gameCard(number) {

    const name = getGameName(number);

    return `
        <div class="game jellyGame">

            <img
                src="${number}.png"
                alt="${name}"
            >

            <h3>${name}</h3>

            <p>${name}</p>

            <a
                class="play"
                href="${number}.html"
                onclick="recordVisit(${number})"
            >
                Play
            </a>

        </div>
    `;
}

/* DATE */

function getTodayKey() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}

/* POPULARITY */

function getPopularity() {

    const today = getTodayKey();

    const saved = JSON.parse(
        localStorage.getItem("tungGamePopularity") || "{}"
    );

    if (saved.date !== today) {

        const fresh = {
            date: today,
            visits: {}
        };

        localStorage.setItem(
            "tungGamePopularity",
            JSON.stringify(fresh)
        );

        return fresh;
    }

    return saved;
}

/* RECORD VISIT */

function recordVisit(number) {

    const popularity = getPopularity();

    popularity.visits[number] =
        (popularity.visits[number] || 0) + 1;

    localStorage.setItem(
        "tungGamePopularity",
        JSON.stringify(popularity)
    );
}

/* POPULAR GAMES */

function getPopularGames() {

    const popularity = getPopularity();

    const games = Array.from(
        { length: GAME_COUNT },
        (_, index) => index + 1
    );

    games.sort((a,b) => {

        const visitsA =
            popularity.visits[a] || 0;

        const visitsB =
            popularity.visits[b] || 0;

        if (visitsA !== visitsB) {
            return visitsB - visitsA;
        }

        return a - b;
    });

    return games;
}

/* HOME = TOP 8 */

function renderHomeGames() {

    const list =
        document.getElementById("gameList");

    list.innerHTML =
        getPopularGames()
            .slice(0, HOME_GAME_COUNT)
            .map(number => gameCard(number))
            .join("");

    addJellyGameEffects();
}

/* ALL 100 GAMES */

function renderAllGames() {

    const list =
        document.getElementById("allGameList");

    list.innerHTML =
        Array.from(
            { length: GAME_COUNT },
            (_, index) => gameCard(index + 1)
        ).join("");

    addJellyGameEffects();
}

/* TOP BAR JELLY */

document.querySelectorAll(".navButton").forEach(button => {

    let currentX = 0;
    let currentY = 0;

    let targetX = 0;
    let targetY = 0;

    let velocityX = 0;
    let velocityY = 0;

    button.addEventListener("mousemove", event => {

        const rect =
            button.getBoundingClientRect();

        targetX =
            ((event.clientX - rect.left - rect.width / 2) /
            (rect.width / 2)) * 12;

        targetY =
            ((event.clientY - rect.top - rect.height / 2) /
            (rect.height / 2)) * 8;
    });

    button.addEventListener("mouseleave", () => {

        targetX = 0;
        targetY = 0;
    });

    function animate() {

        velocityX +=
            (targetX - currentX) * .16;

        velocityY +=
            (targetY - currentY) * .16;

        velocityX *= .72;
        velocityY *= .72;

        currentX += velocityX;
        currentY += velocityY;

        const rotation =
            (velocityX - velocityY) * .65;

        button.style.transform =
            `translate3d(
                ${currentX}px,
                ${currentY}px,
                0
            ) rotate(${rotation}deg)`;

        requestAnimationFrame(animate);
    }

    animate();
});

/* WHOLE TILE + IMAGE JELLY */

function addJellyGameEffects() {

    document
        .querySelectorAll(".jellyGame")
        .forEach(game => {

        let currentX = 0;
        let currentY = 0;

        let targetX = 0;
        let targetY = 0;

        let velocityX = 0;
        let velocityY = 0;

        game.addEventListener(
            "mousemove",
            event => {

                const rect =
                    game.getBoundingClientRect();

                const x =
                    event.clientX - rect.left;

                const y =
                    event.clientY - rect.top;

                const centerX =
                    rect.width / 2;

                const centerY =
                    rect.height / 2;

                targetX =
                    ((x - centerX) / centerX) * 18;

                targetY =
                    ((y - centerY) / centerY) * 14;
            }
        );

        game.addEventListener(
            "mouseleave",
            () => {

                targetX = 0;
                targetY = 0;
            }
        );

        function animateGame() {

            velocityX +=
                (targetX - currentX) * .12;

            velocityY +=
                (targetY - currentY) * .12;

            velocityX *= .78;
            velocityY *= .78;

            currentX += velocityX;
            currentY += velocityY;

            const rotation =
                (velocityX - velocityY) * .45;

            const speed =
                Math.sqrt(
                    velocityX * velocityX +
                    velocityY * velocityY
                );

            const stretch =
                Math.min(
                    .035,
                    speed * .0018
                );

            /*
             * THE ENTIRE TILE MOVES.
             * IMAGE, TEXT AND BUTTON ALL MOVE
             * TOGETHER BECAUSE THE TRANSFORM IS
             * APPLIED TO .game.
             */

            game.style.transform =
                `translate3d(
                    ${currentX}px,
                    ${currentY}px,
                    0
                )
                rotate(${rotation}deg)
                scale(
                    ${1 + stretch},
                    ${1 - stretch * .45}
                )`;

            requestAnimationFrame(
                animateGame
            );
        }

        animateGame();
    });
}

/* HOME */

function showHome(event) {

    event.preventDefault();

    document.getElementById("website")
        .style.display = "block";

    document.getElementById("gamesPage")
        .style.display = "none";

    document.getElementById("cloudGaming")
        .style.display = "none";

    renderHomeGames();

    window.scrollTo(0,0);
}

/* GAMES */

function showGames(event) {

    event.preventDefault();

    document.getElementById("website")
        .style.display = "none";

    document.getElementById("gamesPage")
        .style.display = "block";

    document.getElementById("cloudGaming")
        .style.display = "none";

    renderAllGames();

    window.scrollTo(0,0);
}

/* PASSWORD */

function checkPassword() {

    const password =
        document.getElementById("passwordInput")
            .value;

    const error =
        document.getElementById("passwordError");

    if (password === "TUNG") {

        document.getElementById("passwordScreen")
            .style.display = "none";

        document.getElementById("website")
            .style.display = "block";

        error.style.display = "none";

        renderHomeGames();

    } else {

        error.style.display = "block";

        error.style.animation = "none";

        void error.offsetWidth;

        error.style.animation =
            "shake .35s ease";
    }
}

/* CLOUD GAMING */

function openCloudGaming(event) {

    event.preventDefault();

    document.getElementById("website")
        .style.display = "none";

    document.getElementById("gamesPage")
        .style.display = "none";

    document.getElementById("cloudGaming")
        .style.display = "block";

    window.scrollTo(0,0);
}

/* BACK */

function goBack() {

    document.getElementById("cloudGaming")
        .style.display = "none";

    document.getElementById("gamesPage")
        .style.display = "none";

    document.getElementById("website")
        .style.display = "block";

    renderHomeGames();

    window.scrollTo(0,0);
}

/* ENTER PASSWORD WITH ENTER KEY */

document
    .getElementById("passwordInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                checkPassword();
            }

        }
    );

</script>

</body>
</html>
